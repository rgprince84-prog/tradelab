# tradelab — hourly research pipeline on GitHub Actions, published as a live dashboard.
#
# How it fits together
#   * each run checks out the code, restores the market-data cache, runs the pipeline on
#     1h and 4h (scan -> find -> backtest what fired -> plan), weekly also the deep
#     backtests, then exports static data (data.json + png/csv/md) and force-pushes it
#     as a single orphan commit to the `tradelab-data` branch (no history, bounded size);
#   * in its OWN repository (anything not named *.github.io) the workflow also deploys
#     site/ (the page + the data) to GitHub Pages itself, so the page reads ./data/ and
#     nothing has to be clicked in Settings;
#   * inside a USER SITE repository (owner.github.io, Pages served from the default branch)
#     only the data branch is written: the page at `tradelab/index.html` on the default
#     branch fetches the data from raw.githubusercontent.com and renders it client-side,
#     so the default branch never receives bot commits. Scheduled workflows only run from
#     the default branch, so this file must live there; the copy on the `tradelab` code
#     branch is for reference. Anything that syncs the default branch from elsewhere must
#     leave `.github/workflows/` and `tradelab/` in place.
#
# Research tooling only: it places no orders and makes no predictions.
name: tradelab

on:
  schedule:
    - cron: "12 * * * 1-5"          # hourly, Monday-Friday (UTC): 1h + 4h pipelines
    - cron: "12 20,22,23 * * 0"     # Sunday 20:12 UTC deep backtests; 22:12/23:12 as FX reopens
  workflow_dispatch:
    inputs:
      backtests:
        description: "Also run the weekly deep backtests (1d since 2016, 1h since 2024)"
        type: boolean
        default: false

permissions:
  contents: write                   # push to the data branch

concurrency:
  group: tradelab-live
  cancel-in-progress: false

env:
  CODE_BRANCH: tradelab
  DATA_BRANCH: tradelab-data
  PYTHONWARNINGS: ignore
  MPLBACKEND: Agg

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          # In a user-site repo the code is on the `tradelab` branch; in a dedicated repo
          # it is the default branch that triggered this run.
          ref: ${{ endsWith(github.repository, '.github.io') && env.CODE_BRANCH || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -q -r requirements.txt

      - name: Day stamp (one cache save per day) and weekly flag
        id: stamp
        run: |
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          if [ "$(date -u +%u)" = 7 ] && [ "$(date -u +%H)" -ge 19 ] && [ "$(date -u +%H)" -le 21 ]; then
            echo "deep_default=true" >> "$GITHUB_OUTPUT"
          else
            echo "deep_default=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore market-data cache (.cache)
        uses: actions/cache@v4
        with:
          path: .cache
          key: tradelab-marketdata-v1-${{ steps.stamp.outputs.day }}
          restore-keys: |
            tradelab-marketdata-v1-

      - name: Restore previously published dashboard data
        run: |
          mkdir -p site
          # A missing branch is the first run; any other failure must stop the job, or a
          # transient fetch error would be published as an empty history.
          if git ls-remote --exit-code --heads origin "${DATA_BRANCH}" >/dev/null; then
            git fetch --quiet --depth 1 origin "refs/heads/${DATA_BRANCH}"
            if git cat-file -e "FETCH_HEAD:data" 2>/dev/null; then
              git archive FETCH_HEAD data | tar -x -C site
              echo "restored $(find site/data -type f | wc -l) files from ${DATA_BRANCH}"
            else
              echo "${DATA_BRANCH} exists but holds no data/ directory - starting fresh"
            fi
          else
            rc=$?
            if [ "$rc" -ne 2 ]; then echo "::error::git ls-remote failed (exit $rc)"; exit "$rc"; fi
            echo "no ${DATA_BRANCH} branch yet - first run"
          fi

      - name: Decide whether the deep backtests run
        id: plan
        run: |
          deep=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.backtests }}" = "true" ]; then deep=true; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.stamp.outputs.deep_default }}" = "true" ]; then deep=true; fi
          if [ ! -d site/data/backtest-ema_pullback-1d ]; then deep=true; fi
          echo "deep=$deep" >> "$GITHUB_OUTPUT"
          echo "deep backtests this run: $deep"

      - name: Pipeline on 1h and 4h (scan -> find -> backtest what fired -> plan)
        run: |
          python -m tradelab pipeline --tf 1h
          python -m tradelab pipeline --tf 4h

      - name: Weekly deep backtests
        if: steps.plan.outputs.deep == 'true'
        run: |
          for s in ema_pullback donchian_breakout bb_mean_reversion; do
            python -m tradelab backtest --strategy "$s" --tf 1d --start 2016-01-01 --mc
          done
          for s in ema_pullback donchian_breakout bb_mean_reversion session_orb; do
            python -m tradelab backtest --strategy "$s" --tf 1h --mc
          done

      - name: Export dashboard data
        run: python -m tradelab dashboard --dest site/data

      - name: Job summary
        if: always()
        run: |
          {
            echo "## tradelab run — $(date -u +'%Y-%m-%d %H:%M UTC')"
            for d in out/*-pipeline-*/; do
              [ -f "$d/summary.md" ] || continue
              echo
              head -n 150 "$d/summary.md"
            done
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Publish to the data branch (single orphan commit)
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f site/data/data.json
          pub="$(mktemp -d)"
          cp -r site/data "$pub/data"
          cd "$pub"
          git init -q
          git checkout -q -b "$DATA_BRANCH"
          git add -A
          git -c user.name="tradelab bot" -c user.email="actions@users.noreply.github.com" \
            commit -q -m "tradelab data $(date -u +'%Y-%m-%d %H:%M UTC') (run ${{ github.run_id }})"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/${DATA_BRANCH}"
          echo "published $(find data -type f | wc -l) files to ${DATA_BRANCH}"

      - name: Upload site/ as the Pages artifact (dedicated repository only)
        if: ${{ !endsWith(github.repository, '.github.io') }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    # Only in a dedicated repository. A user-site repo (owner.github.io) serves Pages from
    # its default branch, where tradelab/index.html reads the data branch instead.
    needs: run
    if: ${{ !endsWith(github.repository, '.github.io') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable GitHub Pages for this repository if needed
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
